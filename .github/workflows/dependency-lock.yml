name: Generate dependency lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-lock.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-lock
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile is consistent with package manifest
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Open lockfile pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/real-package-lock
          delete-branch: true
          commit-message: "build: add generated npm lockfile"
          title: "build: add generated npm lockfile"
          body: |
            This pull request contains a lockfile generated by npm in GitHub Actions from the repository's package.json.

            Validation uses npm ci with lifecycle scripts disabled. Electron's binary download and runtime smoke tests are intentionally separate release checks.
          add-paths: package-lock.json
