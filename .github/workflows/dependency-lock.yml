name: Generate dependency lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-lock.yml"

permissions:
  contents: write

concurrency:
  group: dependency-lock
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile is consistent with package manifest
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish generated lockfile branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp package-lock.json "$RUNNER_TEMP/generated-package-lock.json"
          if git ls-remote --exit-code --heads origin automation/real-package-lock >/dev/null 2>&1; then
            git fetch origin automation/real-package-lock
            git switch -C automation/real-package-lock origin/automation/real-package-lock
          else
            git switch -C automation/real-package-lock
          fi
          cp "$RUNNER_TEMP/generated-package-lock.json" package-lock.json
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: update generated npm lockfile"
          fi
          git push --force-with-lease origin automation/real-package-lock
