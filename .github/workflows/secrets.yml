name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan repository for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history for secret detection
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked content and history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
