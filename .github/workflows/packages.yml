name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            args: --linux AppImage deb
          - platform: windows
            os: windows-latest
            args: --win nsis
          - platform: macos
            os: macos-latest
            args: --mac dmg zip
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Run repository validation
        run: npm run validate
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Build platform packages
        run: npx --yes electron-builder@26.0.12 ${{ matrix.args }}
      - name: Stage distributable package artifacts
        run: node scripts/collect-release-artifacts.mjs ${{ matrix.platform }}
      - name: Generate SPDX software bill of materials
        run: node scripts/generate-sbom.mjs release/artifacts/SBOM.spdx.json
      - name: Generate SHA-256 checksums
        run: npm run checksums -- release/artifacts
      - name: Validate package formats, SBOM, and checksums
        run: node scripts/validate-release.mjs ${{ matrix.platform }} release/artifacts
      - name: Attest package, SBOM, and checksum provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/artifacts/*
      - name: Upload package artifacts and dependency inventory
        uses: actions/upload-artifact@v7
        with:
          name: browser-c-${{ matrix.platform }}
          path: release/artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Assemble downloadable GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v7
      - name: Download all validated platform packages
        uses: actions/download-artifact@v7
        with:
          pattern: browser-c-*
          path: release-downloads
      - name: Assemble one consistent release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for platform in linux windows macos; do
            source="release-downloads/browser-c-${platform}"
            test -d "$source"
            find "$source" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          done
          cp release-downloads/browser-c-linux/SBOM.spdx.json release-assets/SBOM.spdx.json
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -s release-assets/SBOM.spdx.json
          (cd release-assets && sha256sum *.AppImage *.deb *.exe *.dmg *.zip SBOM.spdx.json > SHA256SUMS.txt)
          find release-assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Create draft GitHub Release with all platform assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Browser C ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
