name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            args: --linux AppImage deb
          - platform: windows
            os: windows-latest
            args: --win nsis
          - platform: macos
            os: macos-latest
            args: --mac dmg zip
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Run repository validation
        run: npm run validate
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Build platform packages
        run: npx --yes electron-builder@26.0.12 ${{ matrix.args }}
      - name: Generate SHA-256 checksums
        run: npm run checksums
      - name: Validate package formats and checksums
        run: node scripts/validate-release.mjs ${{ matrix.platform }}
      - name: Attest package and checksum provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/*
      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: browser-c-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
