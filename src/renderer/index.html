<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Browser C</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./renderer.js"></script>
</head>
<body>
  <header class="toolbar" aria-label="Browser controls">
    <div class="tab-row">
      <div class="brand"><span class="mark">C</span><span>Browser C</span></div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Open tabs"></div>
      <button id="new-tab" class="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
    </div>
    <div class="controls">
      <button id="back" title="Back" aria-label="Back" disabled>←</button>
      <button id="forward" title="Forward" aria-label="Forward" disabled>→</button>
      <button id="reload" title="Reload" aria-label="Reload">↻</button>
      <form id="address-form" autocomplete="off">
        <span class="security-mark" aria-hidden="true">⌁</span>
        <input id="address" type="text" inputmode="url" spellcheck="false" aria-label="Address or search" placeholder="Search or enter address">
        <button class="go" type="submit" aria-label="Go">↵</button>
      </form>
      <button id="home" title="Home" aria-label="Home">⌂</button>
    </div>
    <div class="library-controls">
      <button id="bookmark-current" title="Bookmark current page" aria-label="Bookmark current page">☆ Bookmark</button>
      <button id="show-bookmarks" title="Show bookmarks">Bookmarks</button>
      <button id="show-history" title="Show browsing history">History</button>
    </div>
    <div id="status" role="status" aria-live="polite">Starting Browser C…</div>
  </header>
  <section id="library-panel" class="library-panel" hidden aria-label="Browser library">
    <div class="library-heading"><strong id="library-title">Bookmarks</strong><button id="close-library" aria-label="Close panel">×</button></div>
    <div id="library-list" class="library-list"></div>
    <button id="clear-history" class="clear-history" hidden>Clear history</button>
  </section>
</body>
</html>
