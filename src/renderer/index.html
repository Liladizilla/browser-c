<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Browser C</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./renderer.js"></script>
</head>
<body>
  <header class="toolbar" aria-label="Browser controls">
    <div class="tab-row">
      <div class="brand"><span class="mark">C</span><span>Browser C</span></div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Open tabs"></div>
      <button id="new-tab" class="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
      <button id="new-private-tab" class="new-private-tab" title="New private tab (Ctrl+Shift+N)" aria-label="New private tab">Private</button>
    </div>
    <div class="controls">
      <button id="back" title="Back" aria-label="Back" disabled>←</button>
      <button id="forward" title="Forward" aria-label="Forward" disabled>→</button>
      <button id="reload" title="Reload" aria-label="Reload">↻</button>
      <form id="address-form" autocomplete="off">
        <span class="security-mark" aria-hidden="true">⌁</span>
        <input id="address" type="text" inputmode="url" spellcheck="false" aria-label="Address or search" placeholder="Search or enter address">
        <button class="go" type="submit" aria-label="Go">↵</button>
      </form>
      <button id="home" title="Home" aria-label="Home">⌂</button>
      <div class="zoom-controls" role="group" aria-label="Page zoom">
        <button id="zoom-out" title="Zoom out (Ctrl+-)" aria-label="Zoom out">−</button>
        <button id="zoom-reset" title="Reset zoom (Ctrl+0)" aria-label="Reset zoom">100%</button>
        <button id="zoom-in" title="Zoom in (Ctrl++)" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="library-controls">
      <button id="bookmark-current" title="Bookmark current page" aria-label="Bookmark current page">☆ Bookmark</button>
      <button id="show-bookmarks" title="Show bookmarks" aria-controls="library-panel" aria-expanded="false">Bookmarks</button>
      <button id="show-history" title="Show browsing history" aria-controls="library-panel" aria-expanded="false">History</button>
      <button id="show-downloads" title="Show downloads" aria-controls="library-panel" aria-expanded="false">Downloads</button>
      <label class="search-provider-label" for="search-provider">Search</label>
      <select id="search-provider" aria-label="Default search provider">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
        <option value="brave">Brave Search</option>
      </select>
      <button id="clear-site-permissions" title="This site has no temporary permissions" disabled>Site access</button>
    </div>
    <div id="find-bar" class="find-bar" hidden role="search" aria-label="Find in page">
      <input id="find-query" type="search" aria-label="Find in page" placeholder="Find in page" maxlength="500">
      <button id="find-previous" title="Previous match" aria-label="Previous match">↑</button>
      <button id="find-next" title="Next match" aria-label="Next match">↓</button>
      <button id="find-close" title="Close find bar" aria-label="Close find bar">×</button>
    </div>
    <div id="status" role="status" aria-live="polite">Starting Browser C…</div>
    <button id="retry-navigation" class="retry-navigation" type="button" hidden>Retry</button>
  </header>
  <section id="library-panel" class="library-panel" hidden aria-labelledby="library-title">
    <div class="library-heading"><strong id="library-title">Bookmarks</strong><button id="close-library" aria-label="Close panel">×</button></div>
    <div id="library-list" class="library-list"></div>
    <button id="clear-history" class="clear-history" hidden>Clear history</button>
  </section>
</body>
</html>
